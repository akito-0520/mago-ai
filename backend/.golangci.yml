version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - misspell
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
        - name: var-naming
        - name: error-return
        - name: error-strings
        - name: indent-error-flow
        - name: unreachable-code
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/akito-0520/mago-ai/backend
